<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free interactive science and maths lessons and labs: IB MYP first, mapped to CBSE/NCERT. Progress stays on your device." />
    <title>AdamLearns: Smart, interactive and experiential learning, wherever you are.</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('adamlearns-settings') || '{}').state?.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
